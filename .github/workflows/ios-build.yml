name: Build unsigned iPhone app
on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - 'NoteVault.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notevault-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Deliberately limited to public repos: avoid spending a private repo allowance.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler and validate project
        run: |
          xcodebuild -version
          xcodebuild -list -project NoteVault.xcodeproj
      - name: Pick an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Test on iOS simulator
        run: |
          xcodebuild test -project NoteVault.xcodeproj -scheme NoteVault -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device application
        run: |
          xcodebuild build -project NoteVault.xcodeproj -scheme NoteVault -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/NoteVault.app package/Payload/
          plutil -lint package/Payload/NoteVault.app/Info.plist
          cd package
          /usr/bin/zip -qry ../NoteVault-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NoteVault-unsigned-NOT-INSTALLABLE-UNTIL-SIGNED
          path: NoteVault-unsigned.ipa
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: TestResults.xcresult
          retention-days: 1
          if-no-files-found: ignore

